<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #1d2130 0%, #0b0d13 65%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e8eaf0;
    display: flex; align-items: center;
    position: relative;
  }
  .glow {
    position: absolute; right: -140px; top: -180px; width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(124,92,191,.28) 0%, transparent 65%);
  }
  .left {
    width: 660px; padding-left: 72px; padding-top: 8px;
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .brand img { width: 96px; height: 96px; }
  .brand .name { font-size: 58px; font-weight: 800; letter-spacing: -1px; color: #fff; }
  .brand .name span { color: #a98fe0; }
  .tagline {
    font-size: 33px; font-weight: 600; line-height: 1.3; color: #cdd2df;
    margin-bottom: 34px; max-width: 560px;
  }
  .tagline em { color: #fff; font-style: normal; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
  .chip {
    font-size: 19px; font-weight: 600; color: #c9b8f0;
    border: 1.5px solid rgba(169,143,224,.45); border-radius: 999px;
    padding: 8px 18px;
    background: rgba(124,92,191,.12);
  }
  .local { font-size: 20px; color: #8b919f; letter-spacing: .4px; }
  .local b { color: #ff8c1a; font-weight: 700; }
  .right {
    flex: 1; display: flex; justify-content: center; align-items: center;
  }
  .shot {
    width: 380px; border-radius: 18px; overflow: hidden;
    transform: rotate(3.5deg);
    box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(169,143,224,.25);
  }
  .shot img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand">
      <img src="public/gamepilotlogo.png" alt="" />
      <div class="name">Game<span>Pilot</span></div>
    </div>
    <div class="tagline">Your games have been recording your life. <em>GamePilot reads it back.</em></div>
    <div class="chips">
      <div class="chip">Named eras</div>
      <div class="chip">Persona + receipts</div>
      <div class="chip">Gaming vitals</div>
      <div class="chip">Memoirs</div>
      <div class="chip">Year in Review</div>
    </div>
    <div class="local"><b>Local-first.</b> Every launcher, one story. No account, no telemetry.</div>
  </div>
  <div class="right">
    <div class="shot"><img src="screenshots/your-story.png" alt="" /></div>
  </div>
</body>
</html>
